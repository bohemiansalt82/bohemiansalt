<script src="jquery.masonry.min.js"></script>
<script>
  $(function(){
    
    $('#container').masonry({
      itemSelector: '.box',
	  columnWidth: 0,
      isAnimated:true
      
    });
    
  });


   $(".box").hover(
	function () {
		$(".description").hide("fast");
		$(this).children(".description").show("fade");
    },
	function(){
		$(this).children(".description").hide("fade");
	});

  function adjustZoom() {
  const baseWidth = 1920; // 기준 해상도
  const scale = window.innerWidth / baseWidth; // 현재 해상도 대비 배율 계산
  document.body.style.transform = `scale(${scale})`;
  document.body.style.transformOrigin = 'top left';
}

window.addEventListener('resize', adjustZoom);
adjustZoom(); // 초기 실행
</script>
